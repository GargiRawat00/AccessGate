name: C++ Build and Demo

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-demo:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential \
            cmake \
            ninja-build \
            nlohmann-json3-dev \
            libsqlite3-dev \
            libssl-dev \
            libboost-system-dev \
            libboost-thread-dev \
            sqlite3 \
            curl \
            psmisc \
            python3

      - name: Configure
        run: cmake -S . -B build -G Ninja

      - name: Build
        run: cmake --build build

      - name: Run AccessGate demo smoke test
        run: ./scripts/demo.sh
